name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'status.json'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install Elm
        run: npm install -g elm@0.19.1

      - name: Get commit hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Replace commit placeholder
        run: |
          find . -name '*.elm' -type f -exec sed -i 's/"GITHUB_ACTIONS_COMMIT_HASH_PLACEHOLDER"/"${{ env.COMMIT_HASH }}"/g' {} \;

      - name: Build Elm application
        run: |
          elm make src/Main.elm --optimize --output=dist/bundle.js
          npx --yes terser@5 dist/bundle.js \
            --compress 'pure_funcs=[F2,F3,F4,F5,F6,F7,F8,F9,A2,A3,A4,A5,A6,A7,A8,A9],pure_getters=true,keep_fargs=false,unsafe_comps=true,unsafe=true' \
            --mangle --output dist/bundle.js

      - name: Create index.html
        run: cp index.html dist/index.html

      - name: Create 404.html for SPA routing
        run: |
          cat > dist/404.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <script>
                sessionStorage.setItem("spa-redirect", location.pathname + location.search + location.hash);
                location.replace("/");
              </script>
            </head>
          </html>
          HTMLEOF

      - name: Copy CNAME
        run: cp CNAME dist/CNAME

      - name: Copy static assets
        run: cp -r cont dist/cont && cp -r assets dist/assets

      - name: Verify required static assets
        run: |
          required_assets=(
            optimized/DSC_3666.webp
            optimized/DSC_3689.webp
            optimized/DSC_3745.webp
            optimized/DSC_3765.webp
            optimized/DSC_3766.webp
            optimized/DSC_4007.webp
            optimized/DSC_4055.webp
            optimized/DSC_4056.webp
            optimized/IMG_0119.webp
            optimized/IMG_8976.webp
            optimized/hackmit.webp
            optimized/idrewthis.webp
            engine/worker.js
            engine/tinyfih.js
            engine/rules.js
            engine/encode.js
            engine/nn.js
            engine/webgpu.js
            engine/wgsl/ops.wgsl
            engine/model/tinyfih_final.json
            engine/model/tinyfih_final.bin
          )

          for asset in "${required_assets[@]}"; do
            if [ ! -f "dist/assets/$asset" ]; then
              echo "::error file=assets/$asset::Required deployed asset is missing"
              exit 1
            fi
          done

      - name: Copy status data
        run: |
          [ -f status.json ] && cp status.json dist/status.json || echo '{"history":[]}' > dist/status.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
