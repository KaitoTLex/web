<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ren Lin's personal website and project archive.">
    <title>KaitoTLex.Systems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script src="/bundle.js"></script>
    <script>
      (() => {
        const redirect = sessionStorage.getItem("spa-redirect");

        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          history.replaceState(null, "", redirect);
        }

        const app = Elm.Main.init({
          node: document.getElementById("root"),
          flags: new Date().getTimezoneOffset(),
        });

        let engineWorker = null;

        const worker = () => {
          if (engineWorker) return engineWorker;

          engineWorker = new Worker("/assets/engine/worker.js", { type: "module" });
          engineWorker.addEventListener("message", ({ data }) => {
            app.ports.engineEvent.send(data);
          });
          engineWorker.addEventListener("error", ({ message }) => {
            app.ports.engineEvent.send({
              type: "error",
              message: message || "local agent worker failed",
            });
          });
          return engineWorker;
        };

        app.ports.loadEngine.subscribe(() => {
          worker().postMessage({ type: "load" });
        });

        app.ports.requestEngineMove.subscribe((payload) => {
          worker().postMessage({ type: "move", payload });
        });
      })();
    </script>
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
